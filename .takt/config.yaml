# 出力言語。~/.takt/config.yaml の値に頼らず、プロジェクト側で明記する（project の値が global より優先される）。
language: ja

# レート制限で拒否されたステップだけ、現在と異なる最初の候補で再実行する。作業者に Opus と Fable は使わない（Opus 5.5 は指揮役）。
# 権限不足・データ保持要件・モデル ID エラーなど「使えない」場合は対象外。
rate_limit_fallback:
  switch_chain:
    - provider: codex
      model: gpt-6.1-sol
    - provider: claude
      model: claude-sonnet-5-5

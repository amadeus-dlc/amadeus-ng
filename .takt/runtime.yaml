version: 1
# 作業者のモデルの割り当て（2026-10-06 オーナーの決定）。作業者に Opus と Fable は使わない（Opus 5.5 は指揮役）。
# 実装・修正は Claude Sonnet 5.5、レビューと計画は別の提供元の GPT-6.1-Sol。
# 変えるときは、指揮役の判断で --provider・--model を上書きせず、このファイルの変更としてオーナーに諮る。
#
# レビュー companion（実装中に並走するもの。標準の default 系のワークフローで使う）を有効にする。~/.takt/runtime.yaml の値に
# 頼らず、プロジェクト側で明記する。ただし takt 0.66 は global / project のどちらかが enabled: false なら無効にする。
companion:
  enabled: true
provider:
  profiles:
    sonnet:
      provider: claude
      model: claude-sonnet-5-5
    sol:
      provider: codex
      model: gpt-6.1-sol
      options:
        reasoning_effort: medium
  # 既定（下の割り当てに当たらないステップ）は GPT-6.1-Sol
  defaults:
    profile: sol
  targets:
    steps:
      amadeus-small/implement: { profile: sonnet }
      amadeus-small/review: { profile: sol }
    # `review` タグ付きのステップ（標準のワークフローのレビュアー群を含む）は GPT-6.1-Sol
    tags:
      review:
        profile: sol
    companions:
      ai-antipattern-review-companion: { profile: sonnet }
      testing-review-companion: { profile: sonnet }
      review-companion-moderator: { profile: sonnet }

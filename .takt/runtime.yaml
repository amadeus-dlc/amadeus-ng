version: 1
# レビュー companion を使う（下の targets.companions で割り当てている）。~/.takt/runtime.yaml の値に頼らず、
# プロジェクト側で明記する。ただし takt 0.66.0 は global / project のどちらかが enabled: false なら無効にするので、
# ~/.takt/runtime.yaml に enabled: false と書かれた場合はこの行でも止められない。
companion:
  enabled: true
provider:
  profiles:
    opus:
      provider: claude
      model: claude-opus-5
    fable:
      provider: claude
      model: claude-fable-5-1
  # 既定は Claude Opus 5
  defaults:
    profile: opus
  targets:
    # `review` タグ付きのステップ（レビュアー群）は Claude Fable 5.1
    tags:
      review:
        profile: fable
    # 実装中に並走するレビュー companion と、その指摘を裁定する moderator も Claude Fable 5.1
    companions:
      ai-antipattern-review-companion:
        profile: fable
      testing-review-companion:
        profile: fable
      review-companion-moderator:
        profile: fable

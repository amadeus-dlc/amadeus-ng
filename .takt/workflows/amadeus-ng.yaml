name: amadeus-ng
description: >-
  amadeus-ng（Rust・CQRS+ES）の開発ワークフロー。backend-cqrs の構成に、実装中に並走するレビュー
  companion と、プロジェクトの規則（コーディング規則の正本・CI と同じ検査）を足したもの。
max_steps: 51
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      # 実装中に並走するレビュー companion。担当モデルは .takt/runtime.yaml の targets.companions で決める。
      implementation_companions:
        fixed:
          - ai-antipattern-review-companion
          - testing-review-companion
        pool: []
        moderator: review-companion-moderator
      plan_policy:
        - design-planning
        - cqrs-es
        - architecture
        - backend
        - amadeus-ng
      plan_knowledge:
        - backend
        - cqrs-es
        - architecture
        - amadeus-ng
      testing_policy:
        - coding
        - testing
        - cqrs-es
        - architecture
        - backend
        - amadeus-ng
      testing_knowledge:
        - backend
        - cqrs-es
        - architecture
        - unit-testing
        - amadeus-ng
      development_policy:
        - coding
        - testing
        - cqrs-es
        - architecture
        - backend
        - amadeus-ng
      development_knowledge:
        - backend
        - cqrs-es
        - security
        - architecture
        - amadeus-ng
      reviewer_suite: peer-review-suite-cqrs
      review_policy:
        - coding
        - testing
        - review
        - architecture
        - backend
        - amadeus-ng
      review_knowledge:
        - backend
        - cqrs-es
        - security
        - architecture
        - unit-testing
        - amadeus-ng
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT

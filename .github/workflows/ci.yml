name: CI

on:
  pull_request:
    branches:
      - main
  # NFR2.2: merge queue は merge_group イベントで required checks を要求する。
  # このトリガが無いと queue に入った PR のチェックが走らずマージが進まない。
  # merge_group の ref は gh-readonly-queue/... なので concurrency.group は
  # github.ref のままで PR 側と衝突しない。
  merge_group: {}
  workflow_dispatch: {}

# NFR4.4 (least privilege): CI は読取だけで足りる。ジョブ個別の昇格はしない。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aidlc-distribution:
    name: aidlc-distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with pinned distribution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: 配布物検証で実行する Action を固定
        with:
          submodules: true
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2: Bun 導入処理を固定
        with:
          bun-version: "1.3.13"
      - name: Verify distribution sync and local patches
        run: bun scripts/aidlc-sync.ts --check
      - name: Test distribution replacement and Codex input rewrites
        run: bun test ./scripts/aidlc-sync.test.ts ./scripts/aidlc-harness.test.ts ./scripts/aidlc-unit-lifecycle.test.ts ./.codex/hooks/aidlc-codex-adapter.test.ts

  check:
    name: check
    runs-on: ubuntu-latest
    # NFR2.4: PBT (proptest) の RNG シードを固定して実行経路を決定化する。
    # scripts/coverage.sh の PROPTEST_RNG_SEED と同じ値にすること。
    env:
      PROPTEST_RNG_SEED: "20260823"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust-toolchain.toml が正本: channel と components (rustfmt / clippy / llvm-tools) を
      # ファイルから読み取ってアクションへ渡す。@master は toolchain 入力が必須でファイルを
      # 自動では読まない (PR #25 の初回 CI で実測) ため、ci.yml に値を書き写さず導出する。
      - name: Read rust-toolchain.toml
        id: toolchain
        run: bash scripts/governance/toolchain-inputs.sh >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: ${{ steps.toolchain.outputs.components }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # tools/lint は workspace 非メンバーの detached クレートなので、
          # 独自の target ディレクトリを明示的にキャッシュ対象に加える。
          workspaces: |
            . -> target
            tools/lint -> target

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo lint
        run: cargo lint

      - name: cargo test
        run: cargo test --workspace

      # NFR2.3 (設計監査 C27): tools/lint は workspace 非メンバーの detached クレート
      # なので --workspace に載らない。同じ品質ゲート (fmt / clippy / 自己テスト) を
      # manifest-path 指定で明示的にかける。
      - name: cargo fmt --check (tools/lint)
        run: cargo fmt --manifest-path tools/lint/Cargo.toml --all --check

      - name: cargo clippy (tools/lint)
        run: cargo clippy --manifest-path tools/lint/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (tools/lint)
        run: cargo test --manifest-path tools/lint/Cargo.toml

  quint:
    name: quint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install quint
        run: npm i -g @informalsystems/quint@0.32.0

      - name: Run quint gate (ADR 0003 決定 4)
        run: bash scripts/quint-gate.sh

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # scripts/coverage.sh も同じ値を export するが、ワークフロー側でも明示して
    # ローカルと CI でシードが一致していることを読み取れるようにする (NFR2.4)。
    env:
      PROPTEST_RNG_SEED: "20260823"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # scripts/coverage.sh --base の相対ゲートで base ref の全履歴を worktree
          # チェックアウトする必要があるため、shallow clone (既定) では不足する。
          fetch-depth: 0

      # cargo-llvm-cov に必要な llvm-tools も rust-toolchain.toml の components で入る。
      - name: Read rust-toolchain.toml
        id: toolchain
        run: bash scripts/governance/toolchain-inputs.sh >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: ${{ steps.toolchain.outputs.components }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run coverage gate (pull_request — absolute + relative)
        if: github.event_name == 'pull_request'
        run: bash scripts/coverage.sh --base "origin/${{ github.base_ref }}"

      # merge_group / workflow_dispatch は比較対象の base ref を持たないため絶対
      # ゲートのみ。相対ゲートは同じ変更が pull_request 側で通過済み (NFR2.2)。
      - name: Run coverage gate (merge_group, workflow_dispatch — absolute only)
        if: github.event_name != 'pull_request'
        run: bash scripts/coverage.sh

  # NFR4.1: RustSec advisory DB による依存の脆弱性監査。workspace と detached な
  # tools/lint の 2 つの Cargo.lock を明示的に網羅する。
  # required status check には**しない** — advisory DB / ネットワークの一時障害で
  # 全マージが止まらないようにするため (nfr-design §2)。赤は PR 上で可視になる。
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read rust-toolchain.toml
        id: toolchain
        run: bash scripts/governance/toolchain-inputs.sh >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: ${{ steps.toolchain.outputs.components }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (workspace)
        run: cargo audit

      - name: cargo audit (tools/lint)
        run: cargo audit --file tools/lint/Cargo.lock

  # レビュースレッドのゲート（オーナー指示 2026-08-22 UTC — amadeus-dlc/amadeus の ci.yml に倣う）:
  # 未解決のレビュースレッド（CodeRabbit 等のボットコメントを含む）が残る PR は
  # 「CI Success」を通さない。ボットの「使用量上限で未実行」報告のような定型文は除外。
  # PR でのみ評価し、merge_group ではスキップ（CI Success 側で skipped を許容）。
  review-thread-resolution:
    name: CI Review Thread Gate
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      checks: write
      issues: read
      pull-requests: read
      statuses: write
    uses: j5ik2o/ci/.github/workflows/review-thread-resolution.yml@9cf0e9a8cd74c72de704763025003ed3b7608c65
    with:
      wait_for_other_checks: "false"
      base_branch: main
      required_context: Check unresolved comments
      extra_ignored_auto_report_author_patterns: "cursor\tBugbot couldn't run - usage limit reached"
      ci_ref: 9cf0e9a8cd74c72de704763025003ed3b7608c65

  # 集約ジョブ。ruleset の required checks は check / quint / coverage に加えて「CI Success」を要求する。
  # 配布物の同期・回帰テストも、この集約を通じてマージをブロックする。
  # pull_request では review-thread-resolution の成功も要求し、merge_group / workflow_dispatch では
  # skipped を許容する（merge queue が詰まらない）。audit は advisory（required 外）のままここでは要求しない。
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - aidlc-distribution
      - check
      - quint
      - coverage
      - review-thread-resolution
    if: ${{ always() }}
    steps:
      - name: All required checks passed
        run: |
          require_result() {
            local name="$1" actual="$2"
            if [[ "${actual}" != "success" ]]; then
              echo "${name} was ${actual}; expected success"
              exit 1
            fi
          }
          require_result "aidlc-distribution" "${{ needs['aidlc-distribution'].result }}"
          require_result "check" "${{ needs.check.result }}"
          require_result "quint" "${{ needs.quint.result }}"
          require_result "coverage" "${{ needs.coverage.result }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            require_result "review-thread-resolution" "${{ needs['review-thread-resolution'].result }}"
          elif [[ "${{ needs['review-thread-resolution'].result }}" != "skipped" ]]; then
            echo "review-thread-resolution was ${{ needs['review-thread-resolution'].result }}; expected skipped"
            exit 1
          fi

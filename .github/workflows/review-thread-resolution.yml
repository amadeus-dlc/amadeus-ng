name: Review Thread Resolution

# レビュースレッド状態の再評価（オーナー指示 2026-08-22 UTC — amadeus-dlc/amadeus に倣う）。
# レビュー／コメントの作成・編集・削除、15 分ごと、手動実行で「Check unresolved comments」の
# コミットステータスを更新する。ゲート本体は ci.yml の review-thread-resolution ジョブ。
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to refresh. Leave empty to refresh all open main PRs.
        required: false
        type: string
      wait_for_other_checks:
        description: Wait for other PR checks before evaluating review threads.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# PR ごとに 1 本だけ走らせる（ボットレビューはコメント単位でイベントを連射するため）。
concurrency:
  group: review-thread-resolution-${{ github.event.pull_request.number || github.event.issue.number || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  issues: read
  pull-requests: read
  statuses: write

jobs:
  refresh:
    name: Refresh review-thread state
    uses: j5ik2o/ci/.github/workflows/review-thread-resolution.yml@9cf0e9a8cd74c72de704763025003ed3b7608c65
    permissions:
      contents: read
      checks: write
      issues: read
      pull-requests: read
      statuses: write
    with:
      pr_number: ${{ inputs.pr_number }}
      wait_for_other_checks: ${{ inputs.wait_for_other_checks || 'true' }}
      base_branch: main
      required_context: Check unresolved comments
      extra_ignored_auto_report_author_patterns: "cursor\tBugbot couldn't run - usage limit reached"
      ci_ref: 9cf0e9a8cd74c72de704763025003ed3b7608c65

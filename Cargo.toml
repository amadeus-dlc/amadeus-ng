[workspace]
resolver = "3"
members = [
  "modules/core/command/domain",
  "modules/core/command/use-case",
  "modules/core/command/interface-adapter",
  "modules/core/read-model-updater",
  "modules/core/infrastructure",
  "modules/shared/message-catalog",
  "modules/app/aidlc",
  "modules/harness/claude",
  "modules/harness/infrastructure",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/amadeus-dlc/amadeus-ng"

# 2026-08-22 オーナー規約のリント一式。unwrap/expect のテスト許可は clippy.toml、
# redundant_clone はプロダクト・テスト両方で禁止。
[workspace.lints.rust]
# NFR4.3: unsafe をワークスペース全体で禁止する。クレート個別の
# `#![forbid(unsafe_code)]` 頼みだと新しいクレート (例: app スタブ) で漏れるため、
# workspace lints へ昇格して構造的に塞ぐ。detached の tools/lint は継承しないので
# tools/lint/Cargo.toml の [lints.rust] に同じ宣言を置く。
unsafe_code = "forbid"
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
dropping_copy_types = "deny"
unreachable_pub = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# 2026-08-22 オーナー裁定（code-generation Q1 = A）: 添字アクセスと panic! も
# unwrap/expect と同じ「境界チェックなしで panic しうる操作」に属するため deny へ昇格。
indexing_slicing = "deny"
panic = "deny"
redundant_clone = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
redundant_field_names = "deny"
redundant_pattern = "deny"
redundant_static_lifetimes = "deny"
unnecessary_to_owned = "deny"
unnecessary_struct_initialization = "deny"
needless_borrow = "deny"
needless_pass_by_value = "deny"
manual_ok_or = "deny"
manual_map = "deny"
manual_let_else = "deny"
manual_strip = "deny"
unused_async = "deny"
unused_self = "deny"
unnecessary_wraps = "deny"
unreachable = "deny"
empty_enums = "deny"
no_effect = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
dbg_macro = "deny"
missing_const_for_fn = "deny"
must_use_candidate = "deny"
trivially_copy_pass_by_ref = "deny"
clone_on_copy = "deny"
len_without_is_empty = "deny"
wrong_self_convention = "deny"
from_over_into = "deny"
eq_op = "deny"
bool_comparison = "deny"
needless_bool = "deny"
match_like_matches_macro = "deny"
manual_assert = "deny"
naive_bytecount = "deny"
if_same_then_else = "deny"
cmp_null = "deny"

[workspace.dependencies]
# 内部クレート (層 = クレート)
core-command-domain = { path = "modules/core/command/domain" }
# CQRS の側分割 (2026-08-29 オーナー裁定 / ADR-009)。コマンド側とクエリ側は互いの
# `Cargo.toml` に現れてはならない — 境界はクレート分離で物理強制する
# (`coding-rules/cqrs-boundaries.md`)。
core-command-use-case = { path = "modules/core/command/use-case" }
core-command-interface-adapter = { path = "modules/core/command/interface-adapter" }
core-read-model-updater = { path = "modules/core/read-model-updater" }
message-catalog = { path = "modules/shared/message-catalog" }
# infrastructure 層は文脈ごとに置く (`coding-rules/infrastructure-layer.md`)。
core-infrastructure = { path = "modules/core/infrastructure" }
harness-infrastructure = { path = "modules/harness/infrastructure" }

# 外部クレート。serde_json の preserve_order は ADR 0001 決定 3 / BR1.8 により
# ワークスペース全体で常時有効にする (Cargo のフィーチャ統合はビルド全体に効くため、
# クレート単独ビルドでも同じ順序になるよう workspace 依存で一元化する)。
serde = { version = "1", features = ["derive"] }
# float_roundtrip: 既定の serde_json は浮動小数を「最善努力精度」で読むため、有効桁の
# 末尾 1 ULP がずれることがある (PBT で検出)。JS の `JSON.parse` は正しく丸めるので、
# 有効にしないと同じテキストから別の f64 になり upstream 互換が壊れる (NFR1)。
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# event-store-adapter-rs v3.0.0 (ADR-010 / B7)。v3 は `Event` / `Aggregate` trait を廃し、
# メタデータを `EventEnvelope` / `SnapshotEnvelope` が運ぶ。したがってドメイン型が直接実装する
# 本家 trait は `AggregateId` (`IntentId`) だけになり、ドメインイベントと集約状態は素の serde 型
# (payload) になる。Conformist は維持 — 封筒を組むのはアダプタ層 (Repository) である。
# 版は `=` で**完全固定**する — 本家のスキーマ・契約に結合しており、上げるときは
# 意図的な作業 (契約の再実測とガードテストの確認) を伴う (ADR-010 決定 4)。
# feature は既定 (空) のまま — memory バックエンドは常時コンパイルされ、SQLite feature は
# アダプタ層が有効にする。
event-store-adapter-rs = "=3.0.0"
# 本家の `Event::occurred_at` / `Aggregate::last_updated_at` が `DateTime<Utc>` を返すため
# (ADR-010 決定 3)。`serde` feature は本家も有効にしており、我々のドメイン型の derive でも要る。
# 自前の ISO 8601 整形 (`format_iso8601_utc`) はこれに置き換わる (NFR4.1 の再検討 — ADR-010)。
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
sha2 = "0.10"
proptest = "1"
# 非同期ポート (AFIT) のテスト実行時。`rt` の current_thread ランタイムだけを使い、
# `Send` を要求しない設計 (C3 / Q3 = A) をそのまま検証できるようにする。
# dev-dependency 限定で、プロダクトコードの依存には入らない (NFR4.1)。
tokio = { version = "1", features = ["rt", "macros"] }
# SQLite ストア (C6 の 3 表) の実装。`bundled` は SQLite 本体をソースから同梱ビルドし、
# 実行環境の libsqlite3 の版差を消す (upstream 互換の観測面に版差を持ち込まないため)。
# 版は Cargo.lock で正確に固定される。
rusqlite = { version = "0.40.2", features = ["bundled"] }
# テスト支援 (ゴールデン比較器) の正規化規則を `normalization.json` から読んで適用するため。
# dev-dependency 限定であり、canon-json のランタイム依存 (NFR4.1: sha2 / serde / serde_json)
# には入らない。
regex = "1"

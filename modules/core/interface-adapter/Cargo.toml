[package]
name = "core-interface-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
core-use-case = { workspace = true }
core-domain = { workspace = true }
audit-events = { workspace = true }
directive-schema = { workspace = true }
canon-json = { workspace = true }
message-catalog = { workspace = true }
infra-io = { workspace = true }
# C6 の 3 表を持つ SQLite ストア (BR2.1 / BR2.2)。同梱ビルドで版差を消す。
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 時計とイベントの発生時刻が `DateTime<Utc>` になった (ADR-010 決定 3)。
chrono = { workspace = true }
# ドメイン型を本家 trait 越しに触る (`Aggregate::set_version` / `Event::seq_nr` ほか)。
event-store-adapter-rs = { workspace = true }

[dev-dependencies]
tempfile = "3"
# 非同期ポート (AFIT) の契約テストを回す current_thread ランタイム (C3 / Q3 = A)。
tokio = { workspace = true }
# ワイヤ形式のラウンドトリップ PBT (BR2.5 / NFR2.2)。シードは PROPTEST_RNG_SEED で固定する。
proptest = { workspace = true }

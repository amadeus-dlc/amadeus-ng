[package]
name = "core-infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
libc = "0.2"
# canon_json (正準 JSON — ADR 0001) の直列化・ダイジェスト。
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# 鍵付き封緘の純粋コーデック (`codec`) — HMAC-SHA256 と base64url。I/O は含まない。
hmac = { workspace = true }
base64 = { workspace = true }
nix = { version = "0.30", default-features = false, features = ["signal", "fs"] }

[dev-dependencies]
tempfile = "3"
proptest = { workspace = true }
# ゴールデン比較器 (tests/support) が normalization.json の regex 規則を適用するため。
regex = { workspace = true }


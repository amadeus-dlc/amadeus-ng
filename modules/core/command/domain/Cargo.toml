[package]
name = "core-command-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# **ここに serde と event-store-adapter-rs は書かない** — ドメインは永続化知識から中立で
# あり、この Cargo.toml がその機械強制である
# (`coding-rules/domain-persistence-neutrality.md`)。直列化属性・ストアの trait 実装・
# ジャーナル語彙はすべてインターフェイスアダプタ層 (書く側) と RMU (読む側) が持つ。
#
# chrono は残る — 時刻の**値**は永続化知識ではない (規則の対象外条項)。
chrono = { workspace = true }
# uuid は解析のみ (識別子 Domain Primitive の検査点 uuid_v7.rs)。採番はインフラ側の責務。
uuid = { workspace = true }
# 言語拡張 (canon_json のみ — steering ダイジェストの素材組みとハッシュ計算)。純計算で
# あり I/O を持たない。serde derive・ストア語彙は持ち込まないので
# domain-persistence-neutrality の機械強制 (serde / event-store-adapter-rs の不在) は保たれる
# (issue #45。規則正本への射程注記の追記はオーナー確認事項)。
core-infrastructure = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# ITF 準拠テストが Quint のトレース JSON を読む手段 (`serde_json::Value` の読取のみで
# derive は使わない)。外部フィクスチャの読取であって、ドメインの永続化記述ではない。
serde_json = { workspace = true }
